receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host gauges and sums for Honeycomb Correlations (CPU, memory, network).
  # Scraped from the collector container. Utilization metrics are gauges;
  # cpu.time and network.io are monotonic cumulative sums.
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
          system.cpu.logical.count:
            enabled: false
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
        metrics:
          system.network.connections:
            enabled: false
          system.network.dropped:
            enabled: false
          system.network.errors:
            enabled: false
          system.network.packets:
            enabled: false
      load: {}

processors:
  batch:
    send_batch_size: 1000
    timeout: 5s

  # Add useful resource attributes
  resource:
    attributes:
      - key: deployment.environment
        value: "demo"
        action: upsert

  resource/host:
    attributes:
      - key: service.name
        value: pipeline-lab-host
        action: upsert
      - key: deployment.environment
        value: demo
        action: upsert

  batch/host:
    send_batch_size: 1000
    timeout: 5s

exporters:
  # ── Refinery (traces + logs) — sampling proxy before Honeycomb ─
  otlp/refinery:
    endpoint: "refinery:4317"
    tls:
      insecure: true
    headers:
      "x-honeycomb-team": "${env:HONEYCOMB_API_KEY}"

  # ── Honeycomb traces + logs (direct — used when Refinery is bypassed) ─
  otlp/honeycomb:
    endpoint: "api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": "${env:HONEYCOMB_API_KEY}"

  # ── Honeycomb metrics ─
  # Current Honeycomb routes OTLP metrics to the managed Metrics dataset.
  # The legacy x-honeycomb-dataset header is omitted on purpose.
  otlp/honeycomb-metrics:
    endpoint: "api.honeycomb.io:443"
    headers:
      "x-honeycomb-team": "${env:HONEYCOMB_API_KEY}"

  # ── Debug exporter (stdout — helpful for verifying locally) ─
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 20

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  pipelines:
    traces:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [otlp/refinery, debug]

    metrics:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [otlp/honeycomb-metrics, debug]

    metrics/host:
      receivers:  [hostmetrics]
      processors: [resource/host, batch/host]
      exporters:  [otlp/honeycomb-metrics, debug]

    logs:
      receivers:  [otlp]
      processors: [resource, batch]
      exporters:  [otlp/refinery, debug]

  telemetry:
    logs:
      level: info
